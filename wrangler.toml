name = "riyad-almutaqin"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ربط النطاق المخصّص. يتطلّب أن يكون riyadalmutaqin.com منطقةً (zone) فعّالة
# داخل حساب Cloudflare نفسه؛ عندها يُنشئ wrangler سجلّ DNS والشهادة تلقائياً.
routes = [
  { pattern = "riyadalmutaqin.com", custom_domain = true },
  { pattern = "www.riyadalmutaqin.com", custom_domain = true },
]

# الموقع العام يُقدَّم كأصول ثابتة (static assets)، والـ Worker يتولّى /api فقط.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# يُشغّل الـ Worker قبل تقديم الأصول حتى تُضاف ترويسات الأمان لكل صفحة.
run_worker_first = true

# قاعدة البيانات — Cloudflare D1 (SQLite)
# أنشئها بـ:  wrangler d1 create riyad_db   ثم ضع database_id أدناه.
[[d1_databases]]
binding = "DB"
database_name = "riyad_db"
database_id = "b144cc81-8da5-4ccc-83c2-99b399ac8069"
migrations_dir = "migrations"

# تخزين الملفات (صوت/صور) — Cloudflare R2
# أنشئه بـ:  wrangler r2 bucket create riyad-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "riyad-media"

# مُشغّل دوري: ينشر المنشورات المجدولة المستحقّة (كل ٥ دقائق).
[triggers]
crons = ["*/5 * * * *"]

# متغيّرات عامة غير سرّية. الأسرار تُضاف عبر:  wrangler secret put <NAME>
[vars]
ENVIRONMENT = "production"
SITE_NAME = "رياض المتقين"
SITE_URL = "https://riyadalmutaqin.com"
