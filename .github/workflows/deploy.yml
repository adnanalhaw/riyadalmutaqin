name: نشر إلى Cloudflare

# النشر التلقائي: المشروع في بيته المستقل (riyadalmutaqin) — كل دفعة إلى main
# تُطبّق ترحيلات D1 ثم تنشر إلى Cloudflare Workers.
on:
  push:
    branches: [main]
  workflow_dispatch:

# لا نشرَين متزامنَين: الدفعة الأحدث تُلغي ما قبلها المنتظر.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      # القاعدة البعيدة تلحق الكود دائماً: الترحيلات تُطبَّق قبل النشر (idempotent —
      # wrangler يتخطّى المُطبَّق سابقاً)، فلا تصل صفحةٌ لجدولٍ غير موجود.
      - name: ترحيلات قاعدة البيانات (D1)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply riyad_db --remote

      - name: النشر
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
