<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدروس المباشرة — رياض المتقين</title>
  <meta name="description" content="الدروس المباشرة والقادمة والمسجّلة في رياض المتقين، تُنشر تلقائياً على يوتيوب." />
  <meta name="theme-color" content="#03130b" />
  <link rel="icon" href="/assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container">
      <div class="page-head">
        <h1>الدروس المباشرة</h1>
        <p>تابِع البثّ الحيّ، وتعرّف على الدروس القادمة، وراجِع المسجّلة منها.</p>
      </div>

      <section class="section" style="padding-top:1rem">
        <h2 style="text-align:start">البثّ الحالي</h2>
        <div class="vthumb" id="livePlayer" style="aspect-ratio:16/9;max-width:860px">
          <span class="badge soon" style="position:absolute;top:1rem;inset-inline-start:1rem">● لا يوجد بثٌّ حالياً</span>
          <div class="play">▶</div>
        </div>
        <div class="vmeta" id="liveMeta" style="max-width:860px">
          <div class="vtitle">—</div>
          <div class="vdoc">الدكتور: —</div>
        </div>
        <div class="notice" id="liveNotice" hidden></div>
      </section>

      <section class="section" style="padding-top:0">
        <h2 style="text-align:start">الدروس القادمة</h2>
        <div class="card" style="padding:0;overflow:hidden">
          <table class="t">
            <thead>
              <tr><th>العنوان</th><th>الدكتور</th><th>الموعد</th><th>الحالة</th></tr>
            </thead>
            <tbody id="upcomingBody">
              <tr><td colspan="4" class="muted">يجري التحميل…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <h2 style="text-align:start">الدروس المسجّلة</h2>
        <div class="video-grid" id="recordedGrid"><p class="muted">يجري التحميل…</p></div>
      </section>
    </div>
  </main>

  <div data-footer></div>
  <script src="/layout.js"></script>
  <script src="/content.js"></script>
  <script>
    RM.loadLive("#livePlayer", "#liveMeta", "#upcomingBody", "#liveNotice");
    RM.loadRecorded("#recordedGrid");
  </script>
</body>
</html>
