<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدعم والطلبات — لوحة الأدمن</title>
  <meta name="description" content="رسائل المستخدمين وطلباتهم: استعرضها وأغلِقها." />
  <meta name="theme-color" content="#03130b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container">
      <div class="portal">
        <aside class="sidebar" data-admin-nav></aside>

        <section>
          <div class="page-head" style="padding-top:0">
            <h1>الدعم والطلبات</h1>
            <p>رسائل المستخدمين وطلباتهم. تواصَل معهم على بريدهم ثمّ أغلِق التذكرة.</p>
          </div>

          <div style="display:flex;gap:.6rem;margin-bottom:1rem">
            <button class="btn btn-outline rm-tab active" data-status="open">المفتوحة</button>
            <button class="btn btn-outline rm-tab" data-status="closed">المغلقة</button>
          </div>

          <div id="list"><p class="muted">يجري التحميل…</p></div>
        </section>
      </div>
    </div>
  </main>

  <div data-footer></div>
  <script src="/layout.js"></script>
  <script src="/admin/nav.js"></script>
  <script src="/content.js"></script>
  <script>
    (function () {
      var ar = RM.ar, esc = RM.esc, api = RM.api;
      var current = "open";
      var ROLES = { student: "متعلّم", teacher: "معلّم", manager: "مدير الموقع", admin: "أدمن" };

      RM.getMe().then(function (u) {
        if (!u) { location.href = "/login"; return; }
        if (u.role !== "admin") { location.href = "/"; return; }
        load();
      });

      function card(t) {
        var who = (t.name || "زائر") + (t.email ? " · " + t.email : "") + (t.user_role ? " · " + (ROLES[t.user_role] || t.user_role) : " · غير مسجَّل");
        var mailto = t.email ? '<a class="btn btn-ghost" href="mailto:' + esc(t.email) + '">ردّ بالبريد</a>' : "";
        var act = current === "open"
          ? '<button class="btn btn-primary rm-close" data-id="' + t.id + '">إغلاق</button>'
          : '<button class="btn btn-outline rm-reopen" data-id="' + t.id + '">إعادة فتح</button>';
        return '<div class="card" style="margin-bottom:1rem">' +
          '<div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap">' +
          '<strong>' + esc(t.subject || (t.category || "رسالة دعم")) + "</strong>" +
          '<span class="muted" style="font-size:.82rem">' + esc(t.created_at) + "</span></div>" +
          '<div class="muted" style="font-size:.88rem;margin:.2rem 0 .6rem">' + esc(who) + (t.category ? " · " + esc(t.category) : "") + "</div>" +
          '<div style="white-space:pre-wrap;line-height:1.9">' + esc(t.message) + "</div>" +
          '<div style="display:flex;gap:.6rem;margin-top:.8rem">' + mailto + act + "</div></div>";
      }

      function load() {
        api("/api/admin/tickets?status=" + current).then(function (res) {
          var list = (res.d && res.d.tickets) || [];
          var el = document.getElementById("list");
          el.innerHTML = list.length ? list.map(card).join("") : '<p class="muted">لا تذاكر في هذه القائمة.</p>';
        });
      }

      document.querySelector(".rm-tab").parentNode.addEventListener("click", function (e) {
        var t = e.target.closest(".rm-tab"); if (!t) return;
        document.querySelectorAll(".rm-tab").forEach(function (b) { b.classList.remove("active"); });
        t.classList.add("active"); current = t.getAttribute("data-status"); load();
      });

      document.getElementById("list").addEventListener("click", function (e) {
        var c = e.target.closest(".rm-close"), r = e.target.closest(".rm-reopen");
        if (!c && !r) return;
        var id = (c || r).getAttribute("data-id");
        (c || r).disabled = true;
        api("/api/admin/tickets/" + id, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: c ? "close" : "reopen" }),
        }).then(function (res) {
          if (res.ok && res.d.ok) load(); else { alert("تعذّر الإجراء."); (c || r).disabled = false; }
        }).catch(function () { (c || r).disabled = false; });
      });
    })();
  </script>
</body>
</html>
