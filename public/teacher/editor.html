<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المونتاج — رياض المتقين</title>
  <meta name="description" content="محرّر المونتاج داخل المتصفّح: قص وإضافة شعار وعنوان وتصدير." />
  <meta name="theme-color" content="#0b1430" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container">
      <div class="portal">
        <aside class="sidebar" data-teacher-nav></aside>

        <section>
          <div class="page-head" style="padding-top:0">
            <h1>المونتاج</h1>
            <p>حمّل فيديو، قُصّ المقطع، أضِف شعاراً وعنواناً، ثم صدّره — كل ذلك داخل المتصفّح.</p>
          </div>

          <div class="card" style="margin-bottom:1.2rem">
            <div class="field" style="margin:0">
              <label for="file">١) اختر ملف فيديو</label>
              <input type="file" id="file" accept="video/*" />
            </div>
          </div>

          <!-- المعاينة -->
          <div style="position:relative;background:#000;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem">
            <canvas id="stage" style="width:100%;display:block;aspect-ratio:16/9;background:#000"></canvas>
            <video id="src" playsinline style="display:none"></video>
          </div>

          <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem">
            <button class="btn btn-outline" id="play" type="button">▶ تشغيل المقطع</button>
            <button class="btn btn-ghost" id="pause" type="button">⏸ إيقاف</button>
            <span class="muted" id="timeLbl" style="align-self:center">٠:٠٠ / ٠:٠٠</span>
          </div>

          <!-- القص -->
          <div class="card" style="margin-bottom:1.2rem">
            <h3 style="color:var(--gold);margin-top:0">٢) القص</h3>
            <div class="field">
              <label>بداية المقطع: <span class="gold" id="startLbl">٠:٠٠</span></label>
              <input type="range" id="start" min="0" max="100" value="0" step="0.1" style="width:100%" />
            </div>
            <div class="field" style="margin:0">
              <label>نهاية المقطع: <span class="gold" id="endLbl">٠:٠٠</span></label>
              <input type="range" id="end" min="0" max="100" value="100" step="0.1" style="width:100%" />
            </div>
          </div>

          <!-- الشعار والعنوان -->
          <div class="card" style="margin-bottom:1.2rem">
            <h3 style="color:var(--gold);margin-top:0">٣) الشعار والعنوان</h3>
            <div class="field" style="display:flex;align-items:center;gap:.6rem">
              <input type="checkbox" id="logoToggle" checked style="width:auto" />
              <label for="logoToggle" style="margin:0">إظهار شعار رياض المتقين</label>
            </div>
            <div class="field">
              <label for="logoFile">شعار مخصّص (اختياري)</label>
              <input type="file" id="logoFile" accept="image/*" />
            </div>
            <div class="field">
              <label for="title">العنوان على الفيديو</label>
              <input type="text" id="title" placeholder="مثال: شرح كتاب التوحيد — الدرس الأول" />
            </div>
            <div class="field" style="margin:0">
              <label for="subtitle">سطر فرعي (اسم الدكتور — اختياري)</label>
              <input type="text" id="subtitle" placeholder="مثال: د. عبد الله الراشد" />
            </div>
          </div>

          <!-- التصدير -->
          <div class="card">
            <h3 style="color:var(--gold);margin-top:0">٤) التصدير</h3>
            <button class="btn btn-primary" id="export" type="button">⤓ تصدير المقطع</button>
            <span id="status" class="muted" style="margin-inline-start:.8rem"></span>
            <div id="downloadWrap" style="margin-top:1rem"></div>
            <div class="notice" style="margin-top:1rem">
              يعمل المحرّر بالكامل داخل متصفّحك (Canvas + MediaRecorder) — لا يُرفع فيديوك إلى أيّ خادم.
              الناتج بصيغة WebM. دمج عدّة مقاطع سيُضاف لاحقاً.
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div data-footer></div>
  <script src="/layout.js"></script>
  <script src="/teacher/nav.js"></script>
  <script src="/teacher/editor.js"></script>
</body>
</html>
