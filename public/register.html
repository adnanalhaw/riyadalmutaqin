<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب متعلّم — رياض المتقين</title>
  <meta name="description" content="أنشئ حساب متعلّم في رياض المتقين لحضور الدروس المباشرة وحفظ المقاطع." />
  <meta name="theme-color" content="#0b1430" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container">
      <div class="page-head center">
        <h1>إنشاء حساب متعلّم</h1>
        <p>انضمّ إلى رياض المتقين وابدأ رحلتك مع العلم النافع.</p>
      </div>

      <form class="form-wrap" id="registerForm" action="/api/auth/register" method="post" novalidate>
        <div class="field">
          <label for="name">الاسم الكامل</label>
          <input type="text" id="name" name="name" placeholder="اسمك الثلاثي" required />
        </div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required />
        </div>
        <div style="display:flex;gap:.8rem;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:150px">
            <label for="birth_date">تاريخ الميلاد</label>
            <input type="date" id="birth_date" name="birth_date" min="1920-01-01" max="2016-12-31" />
          </div>
          <div class="field" style="flex:1;min-width:150px">
            <label for="nationality">الجنسيّة (الدولة)</label>
            <select id="nationality" name="nationality" data-list="countries" data-placeholder="اختر جنسيّتك…"></select>
          </div>
        </div>
        <div style="display:flex;gap:.8rem;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:150px">
            <label for="country">بلد الإقامة</label>
            <select id="country" name="country" data-list="countries" data-placeholder="اختر بلد إقامتك…"></select>
          </div>
          <div class="field" style="flex:1;min-width:150px">
            <label for="city">المدينة</label>
            <input type="text" id="city" name="city" placeholder="مثال: حولي" />
          </div>
        </div>
        <div style="display:flex;gap:.8rem;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:150px">
            <label for="education_stage">المرحلة الدراسية</label>
            <select id="education_stage" name="education_stage" data-list="stages" data-placeholder="اختر المرحلة…"></select>
          </div>
          <div class="field" style="flex:1;min-width:150px">
            <label for="occupation">الوظيفة</label>
            <select id="occupation" name="occupation" data-list="occupations" data-placeholder="اختر وظيفتك…"></select>
          </div>
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <div class="field">
          <label for="confirm">تأكيد كلمة المرور</label>
          <input type="password" id="confirm" name="confirm" placeholder="••••••••" required />
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%">تسجيل</button>

        <div class="notice" id="regNotice" hidden></div>

        <p class="muted center" style="margin-top:1.2rem">
          <a class="gold" href="/login">لديك حساب بالفعل؟ تسجيل الدخول</a>
          &nbsp;·&nbsp;
          <a class="gold" href="/teach">أنت معلّم؟ قدّم طلباً</a>
        </p>
      </form>
    </div>
  </main>

  <div data-footer></div>
  <script src="/layout.js"></script>
  <script src="/lists.js"></script>
  <script>
    var form = document.getElementById("registerForm");
    var notice = document.getElementById("regNotice");
    function show(msg) { notice.textContent = msg; notice.hidden = false; }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;

      if (password.length < 8) return show("كلمة المرور يجب أن تكون 8 أحرف فأكثر.");
      if (password !== confirm) return show("كلمتا المرور غير متطابقتين.");

      function v(id) { return document.getElementById(id).value.trim(); }
      show("جارٍ إنشاء الحساب…");
      fetch("/api/auth/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          name: name, email: email, password: password,
          birth_date: v("birth_date"), nationality: v("nationality"),
          country: v("country"), city: v("city"),
          education_stage: v("education_stage"), occupation: v("occupation"),
        }),
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (res.ok && res.d.ok) { location.href = "/account"; }
          else { show(res.d.error || "تعذّر إنشاء الحساب."); }
        })
        .catch(function () { show("حدث خطأ في الاتصال. حاوِل مجدداً."); });
    });
  </script>
</body>
</html>
