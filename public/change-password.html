<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تعيين كلمة مرور جديدة — رياض المتقين</title>
  <meta name="description" content="عيّن كلمة مرورٍ جديدة لحسابك في رياض المتقين." />
  <meta name="theme-color" content="#03130b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div data-header></div>

  <main>
    <div class="container">
      <div class="page-head center">
        <h1>تعيين كلمة مرور جديدة</h1>
        <p>اختر كلمة مرورٍ قويّة (٨ أحرف فأكثر).</p>
      </div>

      <form class="form-wrap" id="cpForm" novalidate>
        <div class="field">
          <label for="np">كلمة المرور الجديدة</label>
          <input type="password" id="np" placeholder="••••••••" required minlength="8" />
        </div>
        <div class="field">
          <label for="np2">تأكيد كلمة المرور</label>
          <input type="password" id="np2" placeholder="••••••••" required minlength="8" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">حفظ كلمة المرور</button>
        <div class="notice" id="msg" hidden></div>
      </form>
    </div>
  </main>

  <div data-footer></div>
  <script src="/layout.js"></script>
  <script>
    (function () {
      var msg = document.getElementById("msg");
      function show(t) { msg.hidden = false; msg.textContent = t; }

      // تأكّد أنّ المستخدم مسجّل دخول
      fetch("/api/auth/me", { headers: { accept: "application/json" } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (!d || !d.user) location.href = "/login"; });

      document.getElementById("cpForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var np = document.getElementById("np").value;
        var np2 = document.getElementById("np2").value;
        if (np.length < 8) { show("كلمة المرور يجب أن تكون 8 أحرف فأكثر."); return; }
        if (np !== np2) { show("كلمتا المرور غير متطابقتين."); return; }
        show("جارٍ الحفظ…");
        fetch("/api/auth/change-password", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ new_password: np }),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok && res.d.ok) {
              show("تمّ الحفظ ✓ سيتم تحويلك…");
              fetch("/api/auth/me").then(function (r) { return r.json(); }).then(function (d) {
                var role = d.user && d.user.role;
                location.href = (role === "teacher" || role === "admin") ? "/teacher" : "/account";
              });
            } else { show(res.d.error || "تعذّر الحفظ."); }
          })
          .catch(function () { show("حدث خطأ في الاتصال."); });
      });
    })();
  </script>
</body>
</html>
